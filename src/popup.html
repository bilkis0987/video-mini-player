<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Mini Play Web</title>
  <link rel="stylesheet" href="popup.css">
</head>
<body>
  <div class="header">
    <span class="logo-icon">&#9654;</span>
    <h1>Mini Play Web</h1>
  </div>

  <button class="btn-activate" id="togglePiP">Activate</button>

  <div class="divider"></div>

  <div class="setting">
    <span class="setting-label">Auto-activate</span>
    <label class="toggle">
      <input type="checkbox" id="autoActivate" checked>
      <span class="slider"></span>
    </label>
  </div>

  <div class="status" id="status">Ready</div>

  <script src="popup.js"></script>
</body>
</html>
