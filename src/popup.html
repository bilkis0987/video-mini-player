<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Mini Play Web</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body { width: 280px; font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; background: #1a1a2e; color: #eee; }
    .header { padding: 14px 16px; display: flex; align-items: center; gap: 8px; border-bottom: 1px solid #333; }
    .header h1 { font-size: 14px; font-weight: 600; }
    .header .icon { font-size: 18px; color: #8ab4f8; }
    .btn-pip { display: block; width: calc(100% - 32px); margin: 16px auto; padding: 12px; border: none; border-radius: 8px; background: #8ab4f8; color: #1a1a2e; font-size: 14px; font-weight: 600; cursor: pointer; transition: background 0.2s; }
    .btn-pip:hover { background: #aecbfa; }
    .btn-pip:active { transform: scale(0.98); }
    .divider { height: 1px; background: #333; margin: 0 16px; }
    .setting { display: flex; align-items: center; justify-content: space-between; padding: 12px 16px; }
    .setting-label { font-size: 13px; color: #ccc; }
    .toggle { position: relative; width: 40px; height: 22px; }
    .toggle input { opacity: 0; width: 0; height: 0; }
    .toggle .slider { position: absolute; inset: 0; background: #444; border-radius: 11px; cursor: pointer; transition: background 0.2s; }
    .toggle .slider::before { content: ''; position: absolute; width: 16px; height: 16px; left: 3px; top: 3px; background: #fff; border-radius: 50%; transition: transform 0.2s; }
    .toggle input:checked + .slider { background: #8ab4f8; }
    .toggle input:checked + .slider::before { transform: translateX(18px); }
    .status { padding: 8px 16px 14px; text-align: center; font-size: 12px; color: #888; }
    .status.active { color: #8ab4f8; }
  </style>
</head>
<body>
  <div class="header">
    <span class="icon">&#9634;</span>
    <h1>Mini Play Web</h1>
  </div>

  <button class="btn-pip" id="togglePiP">Activate</button>

  <div class="divider"></div>

  <div class="setting">
    <span class="setting-label">Auto-activate (tab switch)</span>
    <label class="toggle">
      <input type="checkbox" id="autoActivate" checked>
      <span class="slider"></span>
    </label>
  </div>

  <div class="status" id="status">Ready</div>

  <script src="popup.js"></script>
</body>
</html>
